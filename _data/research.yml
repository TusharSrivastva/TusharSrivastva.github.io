- title: Sentiment Analysis of COVID-19 Tweets Using BiLSTM and CNN-BiLSTM
  authors: Tushar Srivastava, Deepak Arora, Puneet Sharma
  venue: Recent Trends in Computing (ICRTC 2022), Lecture Notes in Networks and Systems, vol. 600, Springer, pp. 523–535
