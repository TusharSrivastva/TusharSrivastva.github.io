- title: "Knowledge Compilation into Neural Network Weights: Can LLMs Build Classifiers Without Training Data?"
  authors: Tushar Srivastava
  venue: Independent research, November 2026
  year: 2026
  summary: Tests whether an LLM can write a classifier's weights directly, with no gradients and no data. Given the rule that generated the data, Claude Opus 5.5 wrote a network that reached 93% test accuracy. Without the rule, it fell below always guessing the majority class.
