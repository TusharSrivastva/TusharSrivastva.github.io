<ul class="entries">
  {%- for p in site.data.projects -%}
  <li class="entry">
    <span class="year">{{ p.year }}</span>
    <div>
      <h3><a href="{{ p.links[0].url | relative_url }}">{{ p.title }}</a></h3>
      <p>{{ p.description }}</p>
      {%- if p.stack -%}<p class="stack">{{ p.stack }}</p>{%- endif -%}
      <div class="actions">
        {%- for l in p.links -%}<a href="{{ l.url | relative_url }}">{{ l.label }}</a>{%- endfor -%}
      </div>
    </div>
  </li>
  {%- endfor -%}
</ul>
