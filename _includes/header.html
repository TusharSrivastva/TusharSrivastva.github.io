<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark" aria-hidden="true">TS</span>
      <span class="brand-name">{{ site.title }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      {%- for item in site.nav -%}
        {%- assign active = false -%}
        {%- if page.url == item.url -%}{%- assign active = true -%}{%- endif -%}
        {%- if item.url == "/writing/" and page.layout == "post" -%}{%- assign active = true -%}{%- endif -%}
        <a href="{{ item.url | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor -%}
    </nav>
  </div>
</header>
