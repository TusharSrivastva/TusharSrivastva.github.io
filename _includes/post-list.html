<ul class="entries">
  {%- for post in include.posts -%}
  <li class="entry">
    <time class="year" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %Y" }}</time>
    <div>
      <h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
      {%- if post.description -%}<p>{{ post.description }}</p>{%- endif -%}
    </div>
  </li>
  {%- endfor -%}
</ul>
